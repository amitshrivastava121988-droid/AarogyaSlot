<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AppointoDoc — Booking Page for Every Doctor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg:#F4F8F7; --surface:#FFFFFF; --ink:#152623; --ink-soft:#5B7370;
    --teal:#0E4F49; --teal-deep:#0A3733; --blue:#2E6E82; --coral:#FF6B54;
    --coral-soft:#FFE3DC; --mint:#3FA796; --mint-soft:#DFF3EF;
    --amber:#E8A33D; --amber-soft:#FCEBD2; --border:#E1E9E6; --red:#D64545; --red-soft:#FBE4E2;
    --shadow: 0 8px 24px -12px rgba(14,79,73,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;}
  h1,h2,h3,.display{font-family:'Fraunces',serif; font-weight:600; letter-spacing:-0.01em; margin:0;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit; cursor:pointer;}
  :focus-visible{outline:2px solid var(--coral); outline-offset:2px;}

  /* ===== Shared bits ===== */
  .btn{border:none; border-radius:10px; padding:11px 18px; font-size:14px; font-weight:600; display:inline-flex; align-items:center; gap:8px;}
  .btn-coral{background:var(--coral); color:#fff;}
  .btn-coral:hover{background:#ea5c46;}
  .btn-outline{background:transparent; border:1px solid var(--border); color:var(--ink);}
  .btn-outline:hover{border-color:var(--teal); color:var(--teal);}
  .btn-ghost{background:var(--mint-soft); color:var(--teal);}
  .btn-danger{background:var(--red-soft); color:var(--red);}
  .btn-sm{padding:7px 13px; font-size:12.5px;}
  .btn-block{width:100%; justify-content:center;}
  .btn[disabled]{opacity:.5; cursor:not-allowed;}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:22px;}
  .grid-2{display:grid; grid-template-columns:1.35fr 1fr; gap:20px;}
  .row{display:flex; gap:20px; flex-wrap:wrap;}
  .section-label{font-size:11.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); font-weight:600; margin-bottom:10px;}
  .pill{background:var(--bg); border-radius:100px; padding:3px 10px;}
  .status-badge{font-size:11px; font-weight:600; padding:4px 10px; border-radius:100px;}
  .status-upcoming{background:var(--mint-soft); color:var(--teal);}
  .status-completed{background:#EDEDED; color:#6B6B6B;}
  .status-cancelled{background:var(--coral-soft); color:var(--coral);}
  .status-pending{background:var(--amber-soft); color:#96660E;}
  .status-missed{background:var(--amber-soft); color:#96660E;}
  .empty{text-align:center; padding:40px 20px; color:var(--ink-soft);}
  .empty svg{opacity:.5; margin-bottom:10px;}
  .toast{position:fixed; bottom:24px; right:24px; background:var(--teal-deep); color:#fff; padding:13px 20px; border-radius:12px; font-size:13.5px; box-shadow:var(--shadow); z-index:80; opacity:0; transform:translateY(10px); transition:opacity .25s, transform .25s; display:flex; align-items:center; gap:8px; max-width:80vw;}
  .toast.show{opacity:1; transform:translateY(0);}
  .modal-backdrop{position:fixed; inset:0; background:rgba(10,25,23,0.55); backdrop-filter:blur(2px); display:flex; align-items:center; justify-content:center; z-index:90; padding:20px; overflow-y:auto;}
  .modal{background:var(--surface); border-radius:20px; width:440px; max-width:100%; padding:26px; max-height:88vh; overflow-y:auto; position:relative; margin:auto;}
  .modal.wide{width:480px;}
  .modal h3{font-size:19px; margin-bottom:4px;}
  .modal .sub{font-size:13px; color:var(--ink-soft); margin-bottom:18px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px;}
  .field input, .field select, .field textarea{width:100%; border:1px solid var(--border); border-radius:10px; padding:10px 12px; font-size:14px; font-family:inherit; background:var(--bg);}
  .field textarea{resize:vertical; min-height:70px;}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}
  .modal-actions{display:flex; gap:10px; margin-top:20px; flex-wrap:wrap;}
  .modal-close{position:absolute; top:18px; right:18px; background:var(--bg); border:none; width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--ink-soft);}
  .doc-avatar{width:46px; height:46px; border-radius:12px; flex-shrink:0; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-family:'Fraunces',serif; font-size:17px;}
  .stat-row{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:4px;}
  .chart-wrap{display:flex; align-items:flex-end; gap:10px; height:170px; margin-top:16px; overflow-x:auto; padding-bottom:4px;}
  .chart-bar-col{display:flex; flex-direction:column; align-items:center; gap:6px; min-width:38px; flex:1;}
  .chart-bar-track{display:flex; align-items:flex-end; height:130px;}
  .chart-bar{width:26px; background:linear-gradient(180deg,var(--coral),#ff8f7d); border-radius:6px 6px 2px 2px; transition:height .3s;}
  .chart-bar.mint{background:linear-gradient(180deg,var(--mint),#5fc0ae);}
  .chart-bar.teal{background:linear-gradient(180deg,var(--teal),var(--blue));}
  .chart-bar-val{font-size:10.5px; color:var(--ink); font-weight:600; font-family:'IBM Plex Mono',monospace;}
  .chart-bar-label{font-size:9.5px; color:var(--ink-soft); text-align:center; white-space:nowrap;}
  .stat{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px;}
  .stat .num{font-family:'Fraunces',serif; font-size:24px; color:var(--teal);}
  .stat .num.profit{color:var(--mint);}
  .stat .num.loss{color:var(--red);}
  .stat .lab{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .date-strip{display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-top:10px;}
  .date-pill{flex-shrink:0; border:1px solid var(--border); background:var(--surface); border-radius:12px; padding:9px 14px; text-align:center; min-width:64px;}
  .date-pill .dow{font-size:11px; color:var(--ink-soft);}
  .date-pill .dnum{font-family:'Fraunces',serif; font-size:18px;}
  .date-pill.picked{background:var(--teal); color:#fff; border-color:var(--teal);}
  .date-pill.picked .dow{color:#BFE0DA;}
  .slot-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:9px; margin-top:12px;}
  .sched-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(112px,1fr)); gap:9px; margin-top:12px;}
  .sched-slot{border:1px solid var(--border); background:var(--surface); border-radius:12px; padding:10px 8px; text-align:center; cursor:pointer; transition:border-color .15s, transform .15s;}
  .sched-slot:hover{transform:translateY(-2px);}
  .sched-slot .t{font-family:'IBM Plex Mono',monospace; font-size:12.5px; font-weight:700; color:var(--ink-soft);}
  .sched-slot.empty{color:var(--ink-soft);}
  .sched-slot.empty:hover{border-color:var(--coral); color:var(--coral);}
  .sched-slot.empty .plus{font-size:16px; margin-top:3px;}
  .sched-slot.booked{background:var(--mint-soft); border-color:var(--mint);}
  .sched-slot.booked .t{color:var(--teal);}
  .sched-slot.booked .pn{font-size:11.5px; font-weight:700; margin-top:3px; color:var(--ink); word-break:break-word;}
  .sched-slot.booked .pp{font-size:10px; color:var(--ink-soft);}
  .sched-slot.completed{background:#ECECEC; border-color:#D8D8D8;}
  .sched-slot.completed .t, .sched-slot.completed .pn{text-decoration:line-through; color:#9B9B9B;}
  .sched-slot.completed .pp{color:var(--mint); font-weight:700; text-decoration:none;}
  .sched-slot.missed{background:var(--amber-soft); border-color:#EFCB8E;}
  .sched-slot.missed .pn{color:#96660E;}
  .sched-slot.missed .pp{color:#96660E; font-weight:700;}
  .slot{border:1px solid var(--border); background:var(--surface); border-radius:10px; padding:9px 6px; text-align:center; font-family:'IBM Plex Mono',monospace; font-size:13px;}
  .slot.taken{color:#B8C4C1; background:var(--bg); text-decoration:line-through; cursor:not-allowed;}
  .slot.picked{background:var(--coral); color:#fff; border-color:var(--coral);}
  .pay-method{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
  .pay-method button{flex:1; min-width:80px; border:1.5px solid var(--border); background:var(--surface); border-radius:12px; padding:12px 8px; font-size:13px; font-weight:600; color:var(--ink-soft); display:flex; flex-direction:column; align-items:center; gap:6px;}
  .pay-method button.picked{border-color:var(--coral); color:var(--coral); background:var(--coral-soft);}
  .pay-summary{background:var(--bg); border-radius:12px; padding:14px; margin-bottom:16px;}
  .pay-summary .line{display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px; color:var(--ink-soft);}
  .pay-summary .line.total{color:var(--ink); font-weight:700; font-size:15px; margin-top:8px; padding-top:8px; border-top:1px solid var(--border);}
  .spinner{width:38px; height:38px; border-radius:50%; border:3px solid var(--border); border-top-color:var(--coral); animation:spin .8s linear infinite; margin:20px auto;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .pay-success{text-align:center; padding:10px 0;}
  .pay-success .tick{width:56px; height:56px; border-radius:50%; background:var(--mint); color:#fff; display:flex; align-items:center; justify-content:center; margin:0 auto 14px; font-size:26px;}
  .steps{display:flex; gap:8px; margin-bottom:20px;}
  .step{flex:1; height:4px; border-radius:100px; background:var(--border);}
  .step.done{background:var(--mint);}
  .step.now{background:var(--coral);}
  .ticket{position:relative; background:linear-gradient(155deg, var(--teal) 0%, var(--teal-deep) 100%); color:#fff; border-radius:18px; overflow:hidden; display:flex; box-shadow:var(--shadow);}
  .ticket-main{padding:26px 24px; flex:1; position:relative; z-index:1;}
  .ticket-eyebrow{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:#A9D6CF;}
  .ticket-doc{font-family:'Fraunces',serif; font-size:23px; margin-top:6px;}
  .ticket-spec{font-size:13px; color:#BFE0DA; margin-top:2px;}
  .ticket-meta{display:flex; gap:26px; margin-top:20px;}
  .ticket-meta div .k{font-size:10.5px; color:#9FC9C2; text-transform:uppercase; letter-spacing:.06em;}
  .ticket-meta div .v{font-family:'IBM Plex Mono',monospace; font-size:17px; margin-top:3px;}
  .ticket-stub{width:118px; flex-shrink:0; position:relative; background:rgba(255,255,255,0.08); display:flex; flex-direction:column; align-items:center; justify-content:center; border-left:1px dashed rgba(255,255,255,0.3);}
  .ticket-stub .tok-label{font-size:9.5px; color:#A9D6CF; text-transform:uppercase; letter-spacing:.08em;}
  .ticket-stub .tok-num{font-family:'Fraunces',serif; font-size:34px; margin-top:2px;}
  .perf{position:absolute; left:calc(100% - 118px - 7px); top:0; bottom:0; width:14px; background:radial-gradient(circle at 7px 0, transparent 7px, var(--teal) 7.5px) top left / 14px 14px repeat-y; z-index:2; pointer-events:none;}

  /* ===== DIRECTORY ===== */
  #app-directory{max-width:1100px; margin:0 auto; padding:40px 26px 60px;}
  .dir-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:30px; flex-wrap:wrap; gap:16px;}
  .brand-row{display:flex; align-items:center; gap:12px;}
  .brand-mark{width:42px; height:42px; border-radius:11px; background:linear-gradient(155deg,var(--coral),#ff8f7d); display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:700; color:#fff; font-size:19px; flex-shrink:0;}
  .brand-name{font-family:'Fraunces',serif; font-size:24px; font-weight:600;}
  .brand-sub{font-size:12px; color:var(--ink-soft); margin-top:-2px;}
  .dir-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:18px; margin-top:10px;}
  .dir-card{background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:20px; display:flex; flex-direction:column; gap:12px;}
  .dir-top{display:flex; gap:12px; align-items:flex-start;}
  .dir-name{font-weight:600; font-size:16px;}
  .dir-spec{font-size:12.5px; color:var(--blue);}
  .dir-stats{display:flex; gap:10px; font-size:12px; color:var(--ink-soft); flex-wrap:wrap;}
  .dir-actions{display:flex; gap:8px; margin-top:4px;}
  .add-doc-card{border:1.5px dashed var(--border); border-radius:18px; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px; color:var(--ink-soft); padding:20px; min-height:150px;}
  .add-doc-card:hover{border-color:var(--coral); color:var(--coral);}
  .hero-note{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px 20px; display:flex; gap:14px; align-items:flex-start; margin-bottom:24px;}
  .hero-note .ic{width:38px; height:38px; border-radius:10px; background:var(--mint-soft); color:var(--teal); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .platform-bar{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:22px;}
  .platform-bar .pstat{flex:1; min-width:130px; background:linear-gradient(155deg,#0E4F49,#0A3733); color:#fff; border-radius:14px; padding:14px 16px;}
  .platform-bar .pstat .num{font-family:'Fraunces',serif; font-size:22px;}
  .platform-bar .pstat .lab{font-size:11px; color:#9FC9C2; margin-top:2px;}
  .superadmin-link{font-size:12.5px; color:var(--ink-soft); text-decoration:none; display:flex; align-items:center; gap:6px; margin-top:26px; justify-content:center;}
  .superadmin-link button{background:none; border:none; color:var(--ink-soft); font-size:12.5px; display:flex; align-items:center; gap:6px; text-decoration:underline;}

  /* ===== LOGIN SCREENS ===== */
  .login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; background:radial-gradient(circle at 20% 20%, #0E4F49 0%, #08201d 70%);}
  .login-card{background:var(--surface); border-radius:20px; padding:36px 30px; width:380px; max-width:100%; box-shadow:0 20px 60px -20px rgba(0,0,0,0.5);}
  .login-mark{width:52px; height:52px; border-radius:14px; background:linear-gradient(155deg,var(--coral),#ff8f7d); display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:700; color:#fff; font-size:23px; margin:0 auto 16px;}
  .login-card h2{text-align:center; font-size:21px;}
  .login-card .sub{text-align:center; font-size:13px; color:var(--ink-soft); margin-top:6px; margin-bottom:22px;}
  .login-back{display:block; text-align:center; margin-top:16px; font-size:12.5px; color:var(--ink-soft); background:none; border:none; text-decoration:underline; width:100%;}

  /* ===== ADMIN ===== */
  .admin-app{display:flex; min-height:100vh;}
  .admin-shell{max-width:1100px; margin:0 auto; padding:24px 22px 60px;}
  .admin-breadcrumb{margin-bottom:16px;}
  .admin-breadcrumb button{background:none; border:none; color:var(--ink-soft); font-size:12.5px; font-weight:600; display:flex; align-items:center; gap:6px; cursor:pointer;}
  .admin-breadcrumb button:hover{color:var(--teal);}
  .admin-topbar-v2{display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:14px; padding-bottom:18px; border-bottom:1px solid var(--border);}
  .atb-doc{display:flex; align-items:center; gap:12px;}
  .atb-name{font-family:'Fraunces',serif; font-size:19px; font-weight:600;}
  .atb-spec{font-size:12.5px; color:var(--ink-soft);}
  .section-heading{font-family:'Fraunces',serif; font-size:20px; margin-bottom:16px; display:flex; align-items:center; gap:10px; color:var(--ink);}
  .section-heading svg{color:var(--coral);}
  .sidebar{width:220px; background:var(--teal-deep); color:#F1F7F5; display:flex; flex-direction:column; padding:20px 14px; flex-shrink:0;}
  .back-link{display:flex; align-items:center; gap:8px; color:#9FC9C2; font-size:12.5px; font-weight:600; padding:8px 10px 18px; border:none; background:none;}
  .back-link:hover{color:#fff;}
  .side-doc{display:flex; align-items:center; gap:10px; padding:6px 10px 20px;}
  .side-doc .nm{font-family:'Fraunces',serif; font-size:15px; color:#fff;}
  .side-doc .sp{font-size:11px; color:#9FC4BE;}
  .nav{display:flex; flex-direction:column; gap:3px;}
  .nav-item{display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; color:#C7DEDA; background:transparent; border:none; font-size:14.5px; font-weight:500; text-align:left; transition:background .15s, color .15s;}
  .nav-item svg{flex-shrink:0; opacity:.85;}
  .nav-item:hover{background:rgba(255,255,255,0.06); color:#fff;}
  .nav-item.active{background:var(--coral); color:#fff;}
  .sidebar-foot{margin-top:auto; padding:14px 12px 4px; border-top:1px solid rgba(255,255,255,0.12); font-size:11px; color:#8FB6B0; line-height:1.5;}
  .logout-btn{background:rgba(255,255,255,0.08); border:none; color:#C7DEDA; font-size:12px; padding:8px 10px; border-radius:8px; margin-top:8px; text-align:left;}
  .admin-main{flex:1; min-width:0; display:flex; flex-direction:column;}
  .topbar{display:flex; align-items:center; justify-content:space-between; padding:22px 34px 14px; flex-wrap:wrap; gap:10px;}
  .topbar h1{font-size:24px;}
  #admin-view-root{padding:6px 34px 40px; flex:1;}
  .avroot .view{display:none;}
  .avroot .view.active{display:block;}
  /* ===== ICON TILE GRID (SchoolShield-style tappable tiles) ===== */
  .feature-tile-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:16px; margin-top:6px;}
  .feature-tile{background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:24px 16px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:10px; cursor:pointer; transition:transform .15s, box-shadow .15s, border-color .15s;}
  .feature-tile:hover{transform:translateY(-3px); box-shadow:0 16px 30px -16px rgba(14,79,73,.35); border-color:var(--teal);}
  .feature-tile .ficon{width:58px; height:58px; border-radius:16px; display:flex; align-items:center; justify-content:center;}
  .feature-tile .ftitle{font-weight:700; font-size:14px;}
  .feature-tile .fbadge{font-size:11.5px; color:var(--ink-soft); font-weight:600;}

  .tile-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); gap:12px; margin-top:6px;}
  .tile{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px 14px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:7px; cursor:pointer; transition:transform .15s, box-shadow .15s, border-color .15s;}
  .tile:hover{border-color:var(--teal); box-shadow:0 10px 22px -12px rgba(14,79,73,0.3); transform:translateY(-2px);}
  .tile-icon{width:48px; height:48px; border-radius:14px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .tile-icon.c-upcoming{background:var(--mint-soft); color:var(--teal);}
  .tile-icon.c-completed{background:#ECECEC; color:#7A7A7A;}
  .tile-icon.c-cancelled{background:var(--coral-soft); color:var(--coral);}
  .tile-icon.c-pending{background:var(--amber-soft); color:#96660E;}
  .tile-icon.c-missed{background:var(--amber-soft); color:#96660E;}
  .tile-icon.c-history{background:var(--mint-soft); color:var(--teal);}
  .tile-icon.c-income{background:var(--mint-soft); color:var(--mint);}
  .tile-icon.c-expense{background:var(--red-soft); color:var(--red);}
  .tile-title{font-weight:700; font-size:13px; line-height:1.3; word-break:break-word;}
  .tile-sub{font-size:11px; color:var(--ink-soft);}
  .tile-amt{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:13.5px;}
  .tile-amt.income{color:var(--mint);}
  .tile-amt.expense{color:var(--red);}
  .tile-badge{font-size:9.5px; font-weight:700; padding:2px 9px; border-radius:100px; text-transform:uppercase; letter-spacing:.03em;}
  .detail-row{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--border); font-size:13px;}
  .detail-row:last-child{border-bottom:none;}
  .detail-row .k{color:var(--ink-soft);}
  .detail-row .v{font-weight:600; text-align:right;}
  .detail-icon-big{width:56px; height:56px; border-radius:16px; display:flex; align-items:center; justify-content:center; margin:0 auto 14px;}

  .appt-row{display:flex; align-items:center; gap:14px; padding:14px 4px; border-bottom:1px solid var(--border); flex-wrap:wrap;}
  .appt-row:last-child{border-bottom:none;}
  .appt-time-box{width:78px; text-align:center; flex-shrink:0; font-family:'IBM Plex Mono',monospace;}

/* ================= PERSISTENCE ================= */
const STORAGE_KEY = 'appointodoc-state-v3';
async function loadState(){
  let raw = null;
  try{
    if(window.storage && window.storage.get){
      const r = await window.storage.get(STORAGE_KEY);
      if(r && r.value) raw = r.value;
    }
  }catch(e){ /* fall through to localStorage */ }
  if(!raw){
    try{ raw = localStorage.getItem(STORAGE_KEY); }catch(e){ /* ignore */ }
  }
  if(raw){
    try{ const parsed = JSON.parse(raw); state = Object.assign(state, parsed); }catch(e){ /* ignore corrupt data */ }
  }
}
async function saveState(){
  const raw = JSON.stringify(state);
  let ok = false;
  try{
    if(window.storage && window.storage.set){
      await window.storage.set(STORAGE_KEY, raw);
      ok = true;
    }
  }catch(e){ /* fall through */ }
  if(!ok){
    try{ localStorage.setItem(STORAGE_KEY, raw); }catch(e){ console.error('Could not persist data', e); }
  }
}

function uid(){ return Math.random().toString(36).slice(2,9); }
function pad(n){ return n<10?'0'+n:''+n; }
function fmtDate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function todayStr(){ return fmtDate(new Date()); }
function niceDate(dstr){ return new Date(dstr+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}); }
function dow(dstr){ return new Date(dstr+'T00:00:00').toLocaleDateString('en-IN',{weekday:'short'}); }
function docById(id){ return state.doctors.find(d=>d.id===id); }
function docBySlug(slug){ return state.doctors.find(d=>d.slug===slug); }
function initials(name){ return name.replace('Dr. ','').split(' ').map(w=>w[0]).slice(0,2).join(''); }
function slugify(name){ return name.toLowerCase().replace(/^dr\.?\s*/,'').trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')||uid(); }
function toast(msg){
  const t = document.getElementById('toast');
  t.innerHTML = ICONS.check+'<span>'+msg+'</span>';
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 3200);
}
function seedHash(str){ let h=0; for(let i=0;i<str.length;i++){ h=(h*31+str.charCodeAt(i))%1000; } return h; }
function slotsForDoctorDate(docId,dateStr){
  const doc = docById(docId);
  const wh = (doc && doc.workingHours) || defaultWorkingHours();
  const slots=[];
  (wh.ranges||[]).forEach(r=>{
    if(!r.start || !r.end) return;
    let [sh,sm] = r.start.split(':').map(Number);
    let [eh,em] = r.end.split(':').map(Number);
    let h=sh,m=sm;
    while(h<eh||(h===eh&&m<em)){ slots.push(pad(h)+':'+pad(m)); m+=wh.slotMinutes||20; if(m>=60){m-=60;h++;} }
  });
  return slots.map(t=>({ time:t, taken: isBookedHere(docId,dateStr,t) }));
}
function adminSlotsForDate(doc, dateStr){
  const wh = doc.workingHours || defaultWorkingHours();
  const slots=[];
  (wh.ranges||[]).forEach(r=>{
    if(!r.start || !r.end) return;
    let [sh,sm] = r.start.split(':').map(Number);
    let [eh,em] = r.end.split(':').map(Number);
    let h=sh,m=sm;
    while(h<eh||(h===eh&&m<em)){ slots.push(pad(h)+':'+pad(m)); m+=wh.slotMinutes||20; if(m>=60){m-=60;h++;} }
  });
  return slots.map(t=>({
    time:t,
    appt: state.appointments.find(a=>a.doctorId===doc.id && a.date===dateStr && a.time===t && a.status!=='cancelled')
  }));
}
function isBookedHere(docId,dateStr,time){
  return state.appointments.some(a=>a.doctorId===docId && a.date===dateStr && a.time===time && a.status!=='cancelled');
}
function expireOldAppointments(){
  const today = todayStr();
  let changed = false;
  state.appointments.forEach(a=>{
    if(a.status==='upcoming' && a.date < today){ a.status='missed'; changed = true; }
  });
  if(changed) saveState();
}

function genPassword(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let p=''; for(let i=0;i<6;i++) p += chars[Math.floor(Math.random()*chars.length)];
  return p;
}
function genLoginId(name, mobile){
  const base = slugify(name).replace(/-/g,'_');
  const digits = (mobile||'').replace(/\D/g,'');
  const suffix = digits ? digits.slice(-4) : String(Math.floor(1000+Math.random()*9000));

  const revs = state.reviews.filter(r=>r.doctorId===docId);
  if(!revs.length) return {avg:0, count:0};
  const avg = revs.reduce((s,r)=>s+r.rating,0)/revs.length;

}

  const earnings = state.payments.filter(p=>p.doctorId===docId && p.status==='success').reduce((s,p)=>s+p.amount,0);
  const patients = new Set(appts.map(a=>a.patientPhone)).size;
  return {upcoming:upcoming.length, total:appts.length, earnings, patients};

function dailyApptData(doc){
  const days=[];
  for(let i=13;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i);
    const ds=fmtDate(d);
    const count = state.appointments.filter(a=>a.doctorId===doc.id && a.date===ds && a.status!=='cancelled').length;
    days.push({label: d.toLocaleDateString('en-IN',{day:'numeric',month:'short'}), value:count});
  }
  return days;
}
function monthlyEarningsData(doc){
  const months=[];
  for(let i=5;i>=0;i--){
    const d=new Date(); d.setMonth(d.getMonth()-i);
    const y=d.getFullYear(), m=d.getMonth();
    const total = state.payments.filter(p=>{
      if(p.doctorId!==doc.id || p.status!=='success') return false;
      const pd = new Date(p.date);
      return pd.getFullYear()===y && pd.getMonth()===m;
    }).reduce((s,p)=>s+p.amount,0);
    months.push({label: d.toLocaleDateString('en-IN',{month:'short'}), value: total});
  }
  return months;
}
function peakSlotsData(doc){
  const counts={};
  state.appointments.filter(a=>a.doctorId===doc.id && a.status!=='cancelled').forEach(a=>{ counts[a.time] = (counts[a.time]||0)+1; });
  return Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([time,count])=>({label:time, value:count}));
}
function barChartHtml(data, opts){
  opts = opts || {};
  const max = Math.max(...data.map(d=>d.value), 1);
  const maxH = 130;
  return `<div class="chart-wrap">${data.map(d=>{
    const h = d.value>0 ? Math.max(6, Math.round((d.value/max)*maxH)) : 2;
    return `
      <div class="chart-bar-col">
        <div class="chart-bar-val">${opts.prefix||''}${d.value}</div>
        <div class="chart-bar-track"><div class="chart-bar ${opts.color||''}" style="height:${h}px;"></div></div>
        <div class="chart-bar-label">${d.label}</div>

  }).join('')}</div>`;
}
function docFinance(docId){
  const patientIncome = state.payments.filter(p=>p.doctorId===docId && p.status==='success').reduce((s,p)=>s+p.amount,0);
  const manualIncome = state.ledger.filter(l=>l.doctorId===docId && l.type==='income').reduce((s,l)=>s+l.amount,0);
  const expense = state.ledger.filter(l=>l.doctorId===docId && l.type==='expense').reduce((s,l)=>s+l.amount,0);
  const income = patientIncome + manualIncome;
  return { income, patientIncome, manualIncome, expense, profit: income-expense };
}
function enabledMethods(doc){
  const pm = doc.payMethods || defaultPayMethods();
  const list = [];
  if(pm.upi && pm.upi.enabled) list.push('upi');
  if(pm.card && pm.card.enabled) list.push('card');
  if(pm.netbanking && pm.netbanking.enabled) list.push('netbanking');
  if(pm.cash && pm.cash.enabled) list.push('cash');
  return list.length ? list : ['upi','card'];
}

}

/* ---- robust copy ---- */
function copyText(text, onDone){
  const done = (ok)=>{ if(onDone) onDone(ok); };
  if(navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext){
    navigator.clipboard.writeText(text).then(()=>{ toast('Link copied!'); done(true); }).catch(()=>fallbackCopy());
  } else {
    fallbackCopy();
  }
  function fallbackCopy(){
    try{
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      const success = document.execCommand('copy');
      ta.remove();
      if(success){ toast('Link copied!'); done(true); }
      else { done(false); }
    }catch(e){ done(false); }
  }
}

/* ================= ROUTER ================= */
function parseRoute(){
  const h = location.hash;
  const m = h.match(/^#\/book\/(.+)$/);
  if(m){
    const doc = docBySlug(decodeURIComponent(m[1]));
    if(doc){ ui.route = {type:'public', doctorId:doc.id, slug:doc.slug, lockedPhone:null}; return; }
  }
  const a = h.match(/^#\/admin\/(.+)$/);
  if(a){
    const doc = docBySlug(decodeURIComponent(a[1]));
    if(doc){ ui.route = {type:'admin', doctorId:doc.id, slug:doc.slug}; return; }
  }
  if(h === '#/superadmin'){ ui.route = {type:'superadmin', doctorId:null, slug:null}; return; }
  const p = h.match(/^#\/patient\/([^\/]+)\/([^\/]+)$/) || h.match(/^#\/upload\/([^\/]+)\/([^\/]+)$/);
  if(p){
    const doc = docBySlug(decodeURIComponent(p[1]));
    if(doc){ ui.route = {type:'public', doctorId:doc.id, slug:doc.slug, lockedPhone: decodeURIComponent(p[2])}; return; }
  }
  ui.route = {type:'directory', doctorId:null, slug:null};
}
window.addEventListener('hashchange', ()=>{ parseRoute(); ui.booking={date:null,time:null}; ui.previewMode=false; ui.selectedPatientPhone=null; renderRoot(); window.scrollTo(0,0); });

function renderAdminAppointments(doc){
  if(!ui.scheduleDate) ui.scheduleDate = todayStr();

  const dates = []; for(let i=0;i<14;i++){ const d=new Date(); d.setDate(d.getDate()+i); dates.push(fmtDate(d)); }
  const slots = adminSlotsForDate(doc, ui.scheduleDate);

    <div class="row" style="justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px;">

function schedSlotTile(s){
  if(!s.appt){
    return `<div class="sched-slot empty" data-slot-time="${s.time}"><div class="t">${s.time}</div><div class="plus">+</div></div>`;
  }
  const st = s.appt.status;
  const cls = st==='completed' ? 'completed' : st==='missed' ? 'missed' : 'booked';
  const subLine = st==='completed' ? '✓ Completed' : st==='missed' ? 'Missed' : s.appt.patientPhone;
  return `
    <div class="sched-slot ${cls}" data-slot-time="${s.time}">
      <div class="t">${s.time}</div>
      <div class="pn">${s.appt.patientName}</div>
      <div class="pp">${subLine}</div>
    </div>
  `;
}

/* ---- Patients list (clickable → patient detail) ---- */
function patientGroupsFor(doc){
  const phones = new Set();
  state.appointments.filter(a=>a.doctorId===doc.id).forEach(a=>phones.add(a.patientPhone));
  state.histories.filter(h=>h.doctorId===doc.id).forEach(h=>phones.add(h.patientPhone));
  return [...phones].map(phone=>{
    const appts = state.appointments.filter(a=>a.doctorId===doc.id && a.patientPhone===phone);
    const hist = state.histories.filter(h=>h.doctorId===doc.id && h.patientPhone===phone).sort((a,b)=>b.date.localeCompare(a.date));
    const paid = state.payments.filter(p=>p.doctorId===doc.id && p.status==='success' && appts.some(a=>a.id===p.apptId)).reduce((s,p)=>s+p.amount,0);
    const name = (appts[0]||hist[0])?.patientName || 'Unknown';
    return {phone, name, appts, hist, paid};
  });
}

      </div>
      <div class="field"><label>Choose File</label><input type="file" id="doc-file" accept="image/*,application/pdf"></div>

      <button class="btn btn-coral btn-block" id="doc-save">Save Document</button>
    </div></div>
  `;
  document.getElementById('close-m').addEventListener('click', ()=>{ root.innerHTML=''; });
  document.getElementById('doc-save').addEventListener('click', ()=>{
    const fileInput = document.getElementById('doc-file');
    const file = fileInput.files[0];
    const name = document.getElementById('doc-name').value.trim() || (file ? file.name : 'Document');
    if(!file){ toast('File chunein'); return; }
    if(file.size > 2*1024*1024){ toast('File bahut badi hai — 2MB se chhoti file chunein'); return; }
    const reader = new FileReader();
    reader.onload = ()=>{
      state.documents.push({
        id:uid(), doctorId:doc.id, patientPhone:patient.phone, patientName:patient.name,
        name, category:document.getElementById('doc-cat').value, mimeType:file.type,
        size:file.size, dataUrl:reader.result, uploadedAt:new Date().toISOString(), source
      });
      saveState(); root.innerHTML='';
      toast('Document uploaded');
      if(onSaved) onSaved(); else renderPatientDetail(doc, patient.phone);
    };
    reader.onerror = ()=>toast('File read nahi hui, dobara try karein');
    reader.readAsDataURL(file);
  });
}

function openFeeModal(doc, feeId){
  const existing = feeId ? doc.fees.find(f=>f.id===feeId) : null;
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-backdrop"><div class="modal">
      <button class="modal-close" id="close-m">${ICONS.x}</button>
      <h3>${existing ? 'Edit Fee' : 'Add Fee'}</h3>
      <div class="sub">${existing ? 'Fee ka naam ya amount update karein' : 'Naya fee / service type add karein'}</div>
      <div class="field"><label>Label</label><input id="fee-label" placeholder="e.g. Consultation, Follow-up, Home Visit" value="${existing?existing.label:''}"></div>
      <div class="field"><label>Amount (₹)</label><input id="fee-amount" type="number" placeholder="e.g. 500" value="${existing?existing.amount:''}"></div>
      <div class="modal-actions">
        ${existing ? `<button class="btn btn-danger" style="flex:1;" id="fee-delete">${ICONS.trash} Delete</button>` : ''}
        <button class="btn btn-coral" style="flex:1;" id="fee-save">Save</button>
      </div>
    </div></div>
  `;
  document.getElementById('close-m').addEventListener('click', ()=>{ root.innerHTML=''; });
  document.getElementById('fee-save').addEventListener('click', ()=>{
    const label = document.getElementById('fee-label').value.trim();
    const amount = Number(document.getElementById('fee-amount').value);
    if(!label || !amount || amount<=0){ toast('Label aur sahi amount daalein'); return; }
    if(existing){ existing.label = label; existing.amount = amount; }
    else{ doc.fees.push({id:uid(), label, amount}); }
    doc.fee = doc.fees[0].amount;
    saveState(); root.innerHTML=''; renderAdmin(); toast('Fee saved');
  });
  const delBtn = document.getElementById('fee-delete');
  if(delBtn) delBtn.addEventListener('click', ()=>{
    if(doc.fees.length<=1){ toast('Kam se kam ek fee zaroori hai'); return; }
    doc.fees = doc.fees.filter(f=>f.id!==feeId);
    doc.fee = doc.fees[0].amount;
    saveState(); root.innerHTML=''; renderAdmin(); toast('Fee deleted');
  });
}

function renderPublicInline(doc, isPreview, lockedPhone){
  const root = document.getElementById('root');
  const isPersonal = !!lockedPhone;
  const known = isPersonal ? (state.histories.find(h=>h.doctorId===doc.id && h.patientPhone===lockedPhone) || state.appointments.find(a=>a.doctorId===doc.id && a.patientPhone===lockedPhone)) : null;
  if(isPersonal && ui.patientForm.phone !== lockedPhone){ ui.patientForm.phone = lockedPhone; ui.patientForm.name = known ? known.patientName : ''; ui.patientForm.pendingDocs = []; }

  const myDocs = isPersonal ? state.documents.filter(dc=>dc.doctorId===doc.id && dc.patientPhone===lockedPhone).sort((a,b)=>new Date(b.uploadedAt)-new Date(a.uploadedAt)) : [];
  const rt = docRatingStats(doc.id);
  const allReviews = state.reviews.filter(r=>r.doctorId===doc.id).sort((a,b)=>new Date(b.date)-new Date(a.date));
  const myFamily = isPersonal ? familyMembersFor(lockedPhone) : [];
  const myReview = isPersonal ? state.reviews.find(r=>r.doctorId===doc.id && r.patientPhone===lockedPhone) : null;

  root.innerHTML = `
    ${isPreview ? `<div class="preview-bar"><span>👁 Preview Mode — patients ko yeh page dikhega</span><button id="back-to-admin">${ICONS.back} Back to Dashboard</button></div>` : ''}
    <div id="app-public">
      <div class="pub-hero">
        <div class="pub-avatar" style="background:${doc.color};">${initials(doc.name)}</div>
        <h1>${doc.name}</h1>
        <div class="sp">${doc.spec} · ${doc.exp} yrs experience</div>
        ${rt.count>0 ? `<div><span class="rating-badge">${starsDisplay(rt.avg)}</span><span class="rating-count">${rt.avg} (${rt.count} reviews)</span></div>` : `<div class="rating-count">No ratings yet</div>`}
        <div class="meta"><span>₹${doc.fee} consultation</span><span>·</span><span>${doc.bio}</span></div>
        ${isPersonal ? `<div class="meta" style="margin-top:6px;"><span style="color:var(--teal); font-weight:600;">Ye link sirf ${lockedPhone} ke liye hai</span></div>` : `<div class="pub-lookup"><button id="lookup-toggle">Already booked? Check your appointment</button></div>`}
      </div>
      <div id="pub-lookup-box"></div>
      ${isPersonal ? `
        <div class="row" style="justify-content:space-between; align-items:center; margin-bottom:6px;">
          <div class="section-label" style="margin:0;">Family Members</div>
          <button class="btn btn-outline btn-sm" id="pub-add-family">${ICONS.plus} Add Member</button>
        </div>
        <div class="card" style="margin-bottom:20px;">
          <div class="tile-grid">
            <div class="tile" style="cursor:default;">
              <div class="tile-icon" style="background:var(--mint-soft); color:var(--teal);">${ICONS.users}</div>
              <div class="tile-title">${ui.patientForm.name || 'Self'}</div>
              <div class="tile-sub">Self</div>
            </div>
            ${myFamily.map(m=>`
              <div class="tile" data-fam-member="${m.id}">
                <div class="tile-icon" style="background:var(--mint-soft); color:var(--teal);">${ICONS.users}</div>
                <div class="tile-title">${m.name}</div>
                <div class="tile-sub">${m.relation}${m.age?', '+m.age+'y':''}</div>
              </div>
            `).join('')}
          </div>
        </div>
      ` : ''}
      <div class="section-label">Book New Appointment</div>
      <div id="pub-flow"></div>
      ${isPersonal ? `
        <div class="row" style="justify-content:space-between; align-items:center; margin:22px 0 6px;">
          <div class="section-label" style="margin:0;">My Appointments</div>
        </div>
        <div class="card">
          ${myAppts.length===0 ? `<div class="empty" style="padding:20px 0;">${ICONS.empty}<div>Abhi koi appointment nahi</div></div>` : `<div class="tile-grid">${myAppts.map(a=>apptTilePublic(a)).join('')}</div>`}
        </div>
        <div class="row" style="justify-content:space-between; align-items:center; margin:22px 0 6px;">
          <div class="section-label" style="margin:0;">My Documents</div>
          <button class="btn btn-coral btn-sm" id="pub-add-doc">${ICONS.plus} Add Document</button>
        </div>
        <div class="card" id="pub-docs-card">
          ${myDocs.length===0 ? `<div class="empty" style="padding:20px 0;">${ICONS.file}<div>Abhi koi document nahi</div></div>` :
            myDocs.map(dc=>`
              <div class="doc-item">
                ${dc.mimeType && dc.mimeType.startsWith('image/') ? `<img class="doc-thumb" src="${dc.dataUrl}">` : `<div class="dicon">${ICONS.file}</div>`}
                <div style="flex:1;"><div class="dname">${dc.name}</div><div class="dmeta">${dc.category} · ${fileSizeLabel(dc.size)} · ${niceDate(dc.uploadedAt.slice(0,10))}</div></div>
                ${dc.source==='patient' ? `<button class="btn btn-danger btn-sm" data-del-pubdoc="${dc.id}">${ICONS.trash}</button>` : `<span class="status-badge status-completed">Dr. ne bheja</span>`}
              </div>
            `).join('')}
        </div>
        <div class="row" style="justify-content:space-between; align-items:center; margin:22px 0 6px;">
          <div class="section-label" style="margin:0;">Rate Your Experience</div>
        </div>
        <div class="card">
          <div class="star-input" id="pub-star-input">
            ${[1,2,3,4,5].map(n=>`<span class="star ${myReview && myReview.rating>=n ? 'filled':''}" data-star="${n}">★</span>`).join('')}
          </div>
          <textarea id="pub-review-text" placeholder="Apna experience likhein (optional)...">${myReview?myReview.text:''}</textarea>
          <button class="btn btn-coral btn-block" style="margin-top:12px;" id="pub-submit-review">${myReview?'Update Review':'Submit Review'}</button>
        </div>
      ` : ''}
      <div class="row" style="justify-content:space-between; align-items:center; margin:22px 0 6px;">
        <div class="section-label" style="margin:0;">Patient Reviews</div>
      </div>
      <div class="card">
        ${allReviews.length===0 ? `<div class="empty" style="padding:20px 0;">Abhi koi review nahi hai</div>` :
          allReviews.slice(0,10).map(r=>`
            <div class="review-item">
              <div class="rv-head"><span class="rv-name">${r.patientName}</span><span class="rv-stars">${starsDisplay(r.rating)}</span></div>
              <div class="rv-date">${niceDate(r.date)}</div>
              ${r.text ? `<div class="rv-text">${r.text}</div>` : ''}
            </div>
          `).join('')}
      </div>
      <div class="powered">Powered by <b>AppointoDoc</b> · secure slot booking & payments</div>
    </div>
  `;
  if(isPreview){
    document.getElementById('back-to-admin').addEventListener('click', ()=>{ ui.previewMode=false; renderAdmin(); });
  }
  const lookupBtn = document.getElementById('lookup-toggle');
  if(lookupBtn) lookupBtn.addEventListener('click', ()=>{
    const box = document.getElementById('pub-lookup-box');
    box.innerHTML = box.innerHTML ? '' : `
      <div class="card" style="margin-bottom:20px;">
        <div class="field" style="margin-bottom:10px;"><label>Apna phone number daalein</label><input id="lk-phone" placeholder="10-digit mobile"></div>
        <button class="btn btn-outline btn-sm" id="lk-search">Search My Appointments</button>
        <div id="lk-results" style="margin-top:12px;"></div>
      </div>`;
    if(box.innerHTML){
      document.getElementById('lk-search').addEventListener('click', ()=>{
        const ph = document.getElementById('lk-phone').value.trim();
        const results = state.appointments.filter(a=>a.doctorId===doc.id && a.patientPhone===ph);
        document.getElementById('lk-results').innerHTML = results.length===0 ? `<div style="font-size:13px; color:var(--ink-soft);">Koi appointment nahi mila.</div>` :
          results.map(a=>`
            <div class="appt-row" style="border-bottom:1px solid var(--border);">
              <div class="appt-time-box"><div class="d">${niceDate(a.date)}</div><div class="t">${a.time}</div></div>
              <div class="appt-info"><div class="nm">Token #${a.tokenNo}</div><div class="ph">${a.reason||'—'}</div></div>
              <span class="status-badge status-${a.status}">${a.status}</span>
            </div>`).join('');
      });
    }
  });
  const pubAddDocBtn = document.getElementById('pub-add-doc');
  if(pubAddDocBtn) pubAddDocBtn.addEventListener('click', ()=>{
    const name = ui.patientForm.name.trim();
    if(!name){ toast('Pehle booking form me apna naam likhein'); return; }
    openDocumentModal(doc, {name, phone:lockedPhone}, 'patient', ()=>renderPublicInline(doc, isPreview, lockedPhone));
  });
  document.querySelectorAll('[data-del-pubdoc]').forEach(b=>b.addEventListener('click', ()=>{
    state.documents = state.documents.filter(x=>x.id!==b.dataset.delPubdoc);
    saveState(); renderPublicInline(doc, isPreview, lockedPhone); toast('Document removed');
  }));
  const addFamBtn = document.getElementById('pub-add-family');
  if(addFamBtn) addFamBtn.addEventListener('click', ()=>openFamilyMemberModal(doc, lockedPhone, null));
  document.querySelectorAll('[data-fam-member]').forEach(el=>el.addEventListener('click', ()=>openFamilyMemberModal(doc, lockedPhone, el.dataset.famMember)));
  if(isPersonal){
    if(!ui.reviewDraft) ui.reviewDraft = {rating: myReview?myReview.rating:0};
    else if(ui.reviewDraft.rating===undefined) ui.reviewDraft.rating = myReview?myReview.rating:0;
    document.querySelectorAll('#pub-star-input .star').forEach(s=>s.addEventListener('click', ()=>{
      ui.reviewDraft.rating = Number(s.dataset.star);
      document.querySelectorAll('#pub-star-input .star').forEach(st=>{
        st.classList.toggle('filled', Number(st.dataset.star)<=ui.reviewDraft.rating);
      });
    }));
    const submitReviewBtn = document.getElementById('pub-submit-review');
    if(submitReviewBtn) submitReviewBtn.addEventListener('click', ()=>{
      const rating = ui.reviewDraft.rating || (myReview?myReview.rating:0);
      if(!rating){ toast('Pehle stars par tap karke rating dein'); return; }
      const text = document.getElementById('pub-review-text').value.trim();
      const name = ui.patientForm.name.trim() || 'Patient';
      const existing = state.reviews.find(r=>r.doctorId===doc.id && r.patientPhone===lockedPhone);
      if(existing){ existing.rating = rating; existing.text = text; existing.date = new Date().toISOString(); existing.patientName = name; }
      else{ state.reviews.push({ id:uid(), doctorId:doc.id, patientPhone:lockedPhone, patientName:name, rating, text, date:new Date().toISOString() }); }
      saveState(); toast('Review saved — dhanyavaad!');
      renderPublicInline(doc, isPreview, lockedPhone);
    });
  }
  renderPublicFlow(doc, isPreview, lockedPhone);
}
function openFamilyMemberModal(doc, phone, memberId){
  const root = document.getElementById('modal-root');
  const existing = memberId ? state.familyMembers.find(m=>m.id===memberId) : null;
  root.innerHTML = `
    <div class="modal-backdrop"><div class="modal">
      <button class="modal-close" id="close-m">${ICONS.x}</button>
      <h3>${existing ? 'Edit Family Member' : 'Add Family Member'}</h3>
      <div class="sub">Booking karte waqt inme se kisi ke liye bhi book kar sakte hain</div>
      <div class="field"><label>Name</label><input id="fm-name" value="${existing?existing.name:''}" placeholder="Member ka naam"></div>
      <div class="field"><label>Relation</label>
        <select id="fm-relation">
          ${['Spouse','Child','Parent','Sibling','Grandparent','Other'].map(r=>`<option ${existing&&existing.relation===r?'selected':''}>${r}</option>`).join('')}
        </select>
      </div>
      <div class="field-row">
        <div class="field"><label>Age (optional)</label><input id="fm-age" type="number" value="${existing?existing.age:''}"></div>
        <div class="field"><label>Gender (optional)</label>
          <select id="fm-gender"><option value="">Select</option><option ${existing&&existing.gender==='Male'?'selected':''}>Male</option><option ${existing&&existing.gender==='Female'?'selected':''}>Female</option><option ${existing&&existing.gender==='Other'?'selected':''}>Other</option></select>
        </div>
      </div>
      <div class="modal-actions">
        ${existing ? `<button class="btn btn-danger" style="flex:1;" id="fm-delete">${ICONS.trash} Delete</button>` : ''}
        <button class="btn btn-coral" style="flex:1;" id="fm-save">Save</button>
      </div>
    </div></div>
  `;
  document.getElementById('close-m').addEventListener('click', ()=>{ root.innerHTML=''; });
  document.getElementById('fm-save').addEventListener('click', ()=>{
    const name = document.getElementById('fm-name').value.trim();
    if(!name){ toast('Naam daalein'); return; }
    const data = {
      name, relation: document.getElementById('fm-relation').value,
      age: document.getElementById('fm-age').value.trim(),
      gender: document.getElementById('fm-gender').value
    };
    if(existing){ Object.assign(existing, data); }
    else{ state.familyMembers.push({ id:uid(), ownerPhone:phone, ...data }); }
    saveState(); root.innerHTML=''; renderPublicInline(doc, false, phone); toast('Family member saved');
  });
  const delBtn = document.getElementById('fm-delete');
  if(delBtn) delBtn.addEventListener('click', ()=>{
    state.familyMembers = state.familyMembers.filter(m=>m.id!==memberId);
    saveState(); root.innerHTML=''; renderPublicInline(doc, false, phone); toast('Family member removed');
  });
}
function apptTilePublic(a){
  return `
    <div class="tile" style="cursor:default;">
      <div class="tile-icon c-${a.status}">${ICONS.calendar}</div>
      <div class="tile-title">${niceDate(a.date)}</div>
      <div class="tile-sub">${a.time} · ${a.reason||'—'}</div>
      <span class="tile-badge status-${a.status}">#${a.tokenNo} · ${a.status}</span>
    </div>
  `;
}

function renderPublicFlow(doc, isPreview, lockedPhone){
  const step = !ui.booking.date ? 1 : !ui.booking.time ? 2 : 3;
  const el = document.getElementById('pub-flow');
  let inner = '';

  if(step===1){
    const dates=[]; for(let i=0;i<14;i++){ const d=new Date(); d.setDate(d.getDate()+i); dates.push(fmtDate(d)); }
    inner = `
      <div class="card">
        <div class="section-label">तारीख चुनें · Select Date</div>
        <div class="date-strip">
          ${dates.map(ds=>`<button class="date-pill" data-date="${ds}"><div class="dow">${dow(ds)}</div><div class="dnum">${new Date(ds+'T00:00:00').getDate()}</div></button>`).join('')}
        </div>
      </div>`;
  } else if(step===2){
    const slots = slotsForDoctorDate(doc.id, ui.booking.date);
    inner = `
      <div class="card">
        <div class="row" style="justify-content:space-between; align-items:center;">
          <div class="section-label" style="margin:0;">${niceDate(ui.booking.date)} · समय चुनें</div>
          <button class="btn btn-outline btn-sm" id="ch-date">Change Date</button>
        </div>
        <div class="slot-grid">
          ${slots.map(s=>`<button class="slot ${s.taken?'taken':''}" ${s.taken?'disabled':''} data-time="${s.time}">${s.time}</button>`).join('')}
        </div>
      </div>`;
  } else {
    inner = `
      <div class="card">
        <div class="row" style="justify-content:space-between; align-items:center;">
          <div class="section-label" style="margin:0;">Your Details</div>
          <button class="btn btn-outline btn-sm" id="ch-time">Change Slot</button>
        </div>
        <div class="pay-summary" style="margin-top:10px;">
          <div class="line"><span>Date & Time</span><span>${niceDate(ui.booking.date)}, ${ui.booking.time}</span></div>
        </div>
        ${lockedPhone ? `
        <div class="field"><label>Booking For</label>
          <select id="pf-family-select">
            <option value="">-- Select ya neeche naam type karein --</option>
            <option value="__self__">Self${ui.patientForm.name?' ('+ui.patientForm.name+')':''}</option>
            ${familyMembersFor(lockedPhone).map(m=>`<option value="${m.id}">${m.name} (${m.relation})</option>`).join('')}
          </select>
        </div>` : ''}
        <div class="field"><label>Full Name</label><input id="pf-name" placeholder="Patient ka naam" value="${ui.patientForm.name}"></div>
        <div class="field"><label>Phone Number</label><input id="pf-phone" placeholder="10-digit mobile" value="${ui.patientForm.phone}" ${lockedPhone?'readonly style="background:var(--border);"':''}></div>
        <div class="field"><label>Age (optional)</label><input id="pf-age" type="number" placeholder="e.g. 32" value="${ui.patientForm.age}"></div>
        <div class="field"><label>Reason for visit (optional)</label><textarea id="pf-reason" placeholder="जैसे: बुखार, फॉलो-अप...">${ui.patientForm.reason}</textarea></div>
        <div id="pf-history-note"></div>

        <div class="section-label" style="margin-top:14px;">Documents Attach Karein (optional)</div>
        <input type="file" id="pf-doc-file" accept="image/*,application/pdf">
        <button class="btn btn-outline btn-sm" style="margin-top:8px;" id="pf-doc-attach">${ICONS.plus} Attach Document</button>
        <div id="pf-pending-docs" style="margin-top:10px;">
          ${(ui.patientForm.pendingDocs||[]).map((d,i)=>`
            <div class="doc-item">
              <div class="dicon">${ICONS.file}</div>
              <div style="flex:1;"><div class="dname">${d.name}</div><div class="dmeta">${fileSizeLabel(d.size)}</div></div>
              <button class="btn btn-outline btn-sm" data-remove-pending="${i}">${ICONS.x}</button>
            </div>`).join('')}
        </div>

        <button class="btn btn-coral btn-block" style="margin-top:14px;" id="go-pay" ${isPreview?'disabled title="Preview mode — booking disabled"':''}>Continue to Pay ₹${doc.fee}</button>
        ${isPreview ? `<div style="font-size:12px; color:var(--ink-soft); text-align:center; margin-top:10px;">Preview mode me booking submit nahi hoti</div>` : ''}
      </div>`;
  }

  el.innerHTML = `
    <div class="steps">${[1,2,3].map(n=>`<div class="step ${step>n?'done':step===n?'now':''}"></div>`).join('')}</div>
    ${inner}
  `;

  document.querySelectorAll('[data-date]').forEach(b=>b.addEventListener('click', ()=>{ ui.booking.date=b.dataset.date; renderPublicFlow(doc,isPreview,lockedPhone); }));
  const cd = document.getElementById('ch-date'); if(cd) cd.addEventListener('click', ()=>{ ui.booking.date=null; ui.booking.time=null; renderPublicFlow(doc,isPreview,lockedPhone); });
  document.querySelectorAll('.slot:not(.taken)').forEach(b=>b.addEventListener('click', ()=>{ ui.booking.time=b.dataset.time; renderPublicFlow(doc,isPreview,lockedPhone); }));
  const ct = document.getElementById('ch-time'); if(ct) ct.addEventListener('click', ()=>{ ui.booking.time=null; renderPublicFlow(doc,isPreview,lockedPhone); });

  const famSelect = document.getElementById('pf-family-select');
  if(famSelect) famSelect.addEventListener('change', ()=>{
    const val = famSelect.value;
    const nameInput = document.getElementById('pf-name');
    if(val==='__self__'){ /* keep existing self name as-is */ }
    else if(val){
      const member = state.familyMembers.find(m=>m.id===val);
      if(member){ nameInput.value = member.name; document.getElementById('pf-age').value = member.age||''; }
    }
  });

  const phoneInput = document.getElementById('pf-phone');
  if(phoneInput && !lockedPhone){
    phoneInput.addEventListener('input', ()=>{
      const ph = phoneInput.value.trim();
      const hist = state.histories.filter(h=>h.doctorId===doc.id && h.patientPhone===ph).sort((a,b)=>b.date.localeCompare(a.date))[0];
      const note = document.getElementById('pf-history-note');
      note.innerHTML = hist ? `<div style="background:var(--mint-soft); border-radius:10px; padding:10px 12px; font-size:12.5px; color:var(--teal); margin-bottom:12px;">Welcome back! Aapki pichli visit (${niceDate(hist.date)}): ${hist.diagnosis}</div>` : '';
    });
  }

  const attachBtn = document.getElementById('pf-doc-attach');
  if(attachBtn) attachBtn.addEventListener('click', ()=>{
    const fileInput = document.getElementById('pf-doc-file');
    const file = fileInput.files[0];
    if(!file){ toast('Pehle file chunein'); return; }
    if(file.size > 2*1024*1024){ toast('File bahut badi hai — 2MB se chhoti chunein'); return; }
    if(!ui.patientForm.pendingDocs) ui.patientForm.pendingDocs = [];
    ui.patientForm.name = document.getElementById('pf-name').value.trim();
    ui.patientForm.phone = document.getElementById('pf-phone').value.trim();
    ui.patientForm.age = document.getElementById('pf-age').value.trim();
    ui.patientForm.reason = document.getElementById('pf-reason').value.trim();
    const reader = new FileReader();
    reader.onload = ()=>{
      ui.patientForm.pendingDocs.push({ name:file.name, mimeType:file.type, size:file.size, dataUrl:reader.result, category:'Other' });
      renderPublicFlow(doc, isPreview, lockedPhone);
    };
    reader.readAsDataURL(file);
  });
  document.querySelectorAll('[data-remove-pending]').forEach(b=>b.addEventListener('click', ()=>{
    ui.patientForm.pendingDocs.splice(Number(b.dataset.removePending), 1);
    renderPublicFlow(doc, isPreview, lockedPhone);
  }));

  const goPay = document.getElementById('go-pay');
  if(goPay && !isPreview) goPay.addEventListener('click', ()=>{
    const name = document.getElementById('pf-name').value.trim();
    const phone = lockedPhone || document.getElementById('pf-phone').value.trim();
    if(!name || !phone){ toast('Naam aur phone number daalein'); return; }
    ui.patientForm.name = name; ui.patientForm.phone = phone;
    ui.patientForm.age = document.getElementById('pf-age').value.trim();
    ui.patientForm.reason = document.getElementById('pf-reason').value.trim();
    openPublicPaymentModal(doc, lockedPhone);
  });
}

function openPublicPaymentModal(doc, lockedPhone){
  ui.payModal = {stage:'select', method: enabledMethods(doc)[0], lockedPhone: lockedPhone||null};
  renderPublicPaymentModal(doc);
}
function renderPublicPaymentModal(doc){
  const root = document.getElementById('modal-root');
  if(!ui.payModal){ root.innerHTML=''; return; }
  const lockedPhone = ui.payModal.lockedPhone;
  const methods = enabledMethods(doc);
  const pm = doc.payMethods || defaultPayMethods();
  const methodMeta = {
    upi:{icon:ICONS.upi, label:'UPI'}, card:{icon:ICONS.card, label:'Card'},
    netbanking:{icon:ICONS.bank, label:'Net Banking'}, cash:{icon:ICONS.cash, label:'Pay at Clinic'}
  };
  let body='';
  if(ui.payModal.stage==='select'){
    body = `
      <button class="modal-close" id="pm-close">${ICONS.x}</button>
      <h3>Complete Payment</h3>
      <div class="sub">Secure checkout for your appointment</div>
      <div class="pay-method">
        ${methods.map(m=>`<button class="${ui.payModal.method===m?'picked':''}" data-method="${m}">${methodMeta[m].icon} ${methodMeta[m].label}</button>`).join('')}
      </div>
      ${ui.payModal.method==='upi' && pm.upi.upiId ? `<div style="font-size:12.5px; color:var(--ink-soft); margin:-10px 0 14px;">Paying to: <strong>${pm.upi.upiId}</strong></div>` : ''}
      ${ui.payModal.method==='cash' ? `<div style="font-size:12.5px; color:var(--ink-soft); margin:-10px 0 14px;">Aap clinic pahunch kar cash/card se pay kar sakte hain. Slot abhi confirm ho jayega.</div>` : ''}
      <div class="pay-summary">
        <div class="line"><span>${doc.name}</span><span>${ui.booking.date}, ${ui.booking.time}</span></div>
        <div class="line total"><span>Total Payable</span><span>₹${doc.fee}</span></div>
      </div>
      <button class="btn btn-coral btn-block" id="pm-pay">${ui.payModal.method==='cash' ? 'Confirm Booking' : 'Pay ₹'+doc.fee}</button>`;
  } else if(ui.payModal.stage==='processing'){
    body = `<h3 style="text-align:center;">${ui.payModal.method==='cash'?'Confirming Booking':'Processing Payment'}</h3><div class="spinner"></div><div class="sub" style="text-align:center;">कृपया प्रतीक्षा करें...</div>`;
  } else {
    const a = state.__lastAppt;
    body = `
      <div class="pay-success">
        <div class="tick">${ICONS.check}</div>
        <h3>Appointment Confirmed</h3>
        <div class="sub">${doc.name} ke saath appointment book ho gaya</div>
        <div class="pay-summary" style="text-align:left; margin-top:16px;">
          <div class="line"><span>Date & Time</span><span>${niceDate(a.date)}, ${a.time}</span></div>
          <div class="line"><span>Token No.</span><span>#${a.tokenNo}</span></div>
          <div class="line total"><span>${a.paymentStatus==='pending' ? 'Amount Due at Clinic' : 'Amount Paid'}</span><span>₹${doc.fee}</span></div>
        </div>
        <button class="btn btn-coral btn-block" style="margin-top:18px;" id="pm-done">Done</button>
      </div>`;
  }
  root.innerHTML = `<div class="modal-backdrop"><div class="modal">${body}</div></div>`;
  const close = document.getElementById('pm-close'); if(close) close.addEventListener('click', ()=>{ ui.payModal=null; renderPublicPaymentModal(doc); });
  root.querySelectorAll('[data-method]').forEach(b=>b.addEventListener('click', ()=>{ ui.payModal.method=b.dataset.method; renderPublicPaymentModal(doc); }));
  const payBtn = document.getElementById('pm-pay');
  if(payBtn) payBtn.addEventListener('click', ()=>{
    ui.payModal.stage='processing'; renderPublicPaymentModal(doc);
    setTimeout(()=>confirmPublicBooking(doc), ui.payModal.method==='cash' ? 700 : 1500);
  });
  const doneBtn = document.getElementById('pm-done');
  if(doneBtn) doneBtn.addEventListener('click', ()=>{
    ui.payModal=null; ui.booking={date:null,time:null};
    ui.patientForm={name:'',phone: lockedPhone||'', age:'', reason:'', pendingDocs:[]};
    renderPublicPaymentModal(doc); renderPublic();
  });
}
function confirmPublicBooking(doc){
  if(isBookedHere(doc.id, ui.booking.date, ui.booking.time)){
    ui.payModal = null;
    toast('Ye slot abhi-abhi kisi aur ne book kar liya — kripya dusra slot chunein');
    ui.booking.time = null;
    renderPublicFlow(doc, false, ui.route && ui.route.lockedPhone);
    document.getElementById('modal-root').innerHTML = '';
    return;
  }
  const tokenNo = state.appointments.filter(a=>a.doctorId===doc.id).length + 101;
  const isCash = ui.payModal.method==='cash';
  const appt = {
    id:uid(), doctorId:doc.id, patientName:ui.patientForm.name, patientPhone:ui.patientForm.phone,
    patientAge:ui.patientForm.age, date:ui.booking.date, time:ui.booking.time, reason:ui.patientForm.reason,
    status:'upcoming', fee:doc.fee, tokenNo, paymentStatus: isCash ? 'pending' : 'paid'
  };
  state.appointments.push(appt);
  state.payments.push({ id:uid(), doctorId:doc.id, apptId:appt.id, amount:doc.fee, method:ui.payModal.method, status: isCash?'pending':'success', date:new Date().toISOString(), patientName:ui.patientForm.name });
  (ui.patientForm.pendingDocs||[]).forEach(d=>{
    state.documents.push({
      id:uid(), doctorId:doc.id, patientPhone:ui.patientForm.phone, patientName:ui.patientForm.name,
      name:d.name, category:d.category||'Other', mimeType:d.mimeType, size:d.size, dataUrl:d.dataUrl,
      uploadedAt:new Date().toISOString(), source:'patient'
    });
  });
  ui.patientForm.pendingDocs = [];
  state.__lastAppt = appt;
  saveState();
  ui.payModal.stage='success';
  renderPublicPaymentModal(doc);
}

/* ================= PRESCRIPTION SLIP ================= */
function slipHtml(doc, entry){
  const lines = (entry.prescription||'').split('\n').filter(Boolean);
  const slipNo = (entry.id||'').slice(0,6).toUpperCase();
  return `
    <div class="slip-paper" id="slip-content">
      <div class="slip-band">
        ${doc.logoDataUrl ? `<img class="slip-logo" src="${doc.logoDataUrl}">` : ''}
        <div>
          <div class="slip-clinic">${doc.name}</div>
          <div class="slip-docline">${doc.spec}${doc.clinicName && doc.clinicName!==doc.name ? ' · '+doc.clinicName : ''}</div>
          ${[doc.clinicAddress, doc.clinicPhone, doc.clinicEmail].filter(Boolean).length ? `<div class="slip-contactline">${[doc.clinicAddress, doc.clinicPhone, doc.clinicEmail].filter(Boolean).join('  ·  ')}</div>` : ''}
        </div>
      </div>
      <div class="slip-body">
        ${doc.logoDataUrl ? `<img class="slip-watermark-img" src="${doc.logoDataUrl}">` : ''}
        <div style="position:relative; z-index:1;">
        <div class="slip-infobox">
          <div><b>Patient</b><br>${entry.patientName}${entry.patientAge?', '+entry.patientAge+' yrs':''}${entry.patientGender?', '+entry.patientGender:''}<br>${entry.patientPhone}</div>
          <div style="text-align:right;"><b>Slip No.</b><br>#${slipNo}<br><b>Date:</b> ${niceDate(entry.date)}</div>
        </div>
        ${entry.vitals ? `<div class="slip-label">Vitals</div><div class="slip-val">${entry.vitals}</div>` : ''}
        <div class="slip-label">Diagnosis</div>
        <div class="slip-val">${entry.diagnosis || '—'}</div>
        ${lines.length ? `<div class="slip-label">Rx &nbsp;·&nbsp; Prescription</div><div class="slip-val">${lines.map((l,i)=>`<div class="slip-rx-item"><span class="slip-rx-num">${i+1}.</span>${l}</div>`).join('')}</div>` : ''}
        ${entry.advice ? `<div class="slip-label">Advice</div><div class="slip-val">${entry.advice}</div>` : ''}
        ${entry.notes ? `<div class="slip-label">Notes</div><div class="slip-val">${entry.notes}</div>` : ''}
        <div class="slip-foot">
          <div class="slip-watermark">Generated via AppointoDoc</div>
          <div class="sig"><div class="ln">${doc.name}</div><div class="spec">${doc.spec}</div></div>
        </div>
        </div>
      </div>
    </div>
  `;
}
function buildSlipPdf(doc, entry){
  if(!window.jspdf){ return null; }
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({unit:'pt', format:'a5'});
  const pageW = 420, left = 40, right = pageW-40;
  let y;
  let textLeft = left;

  pdf.setFillColor(14,79,73);
  pdf.rect(0, 0, pageW, 88, 'F');

  if(doc.logoDataUrl){
    try{
      const fmt = doc.logoDataUrl.indexOf('image/png')>-1 ? 'PNG' : 'JPEG';
      pdf.addImage(doc.logoDataUrl, fmt, left, 20, 46, 46, undefined, 'FAST');
      textLeft = left + 58;
    }catch(e){ /* unsupported image format — skip logo, rest of slip still generates */ }
  }

  pdf.setTextColor(255,255,255);
  pdf.setFont('times','bold'); pdf.setFontSize(18);
  pdf.text(doc.name, textLeft, 34);
  pdf.setFont('helvetica','normal'); pdf.setFontSize(10);
  pdf.setTextColor(191,224,218);
  pdf.text(`${doc.spec}${doc.clinicName && doc.clinicName!==doc.name ? '  ·  '+doc.clinicName : ''}`, textLeft, 52);
  const contact = [doc.clinicAddress, doc.clinicPhone, doc.clinicEmail].filter(Boolean).join('   ·   ');
  if(contact){
    pdf.setFontSize(8.5); pdf.setTextColor(159,201,194);
    const contactWrapped = pdf.splitTextToSize(contact, pageW-textLeft-40);
    pdf.text(contactWrapped, textLeft, 68);
  }

  if(doc.logoDataUrl){
    try{
      const fmt = doc.logoDataUrl.indexOf('image/png')>-1 ? 'PNG' : 'JPEG';
      const wSize = 200;
      pdf.saveGraphicsState();
      pdf.setGState(new pdf.GState({opacity:0.06}));
      pdf.addImage(doc.logoDataUrl, fmt, (pageW-wSize)/2, 160, wSize, wSize, undefined, 'FAST');
      pdf.restoreGraphicsState();
    }catch(e){ /* watermark not supported in this jsPDF build — skip silently */ }
  }
  y = 112;

  pdf.setDrawColor(225,233,230); pdf.setFillColor(244,248,247);
  pdf.roundedRect(left, y, right-left, 54, 6, 6, 'FD');
  pdf.setTextColor(20,36,32); pdf.setFont('helvetica','bold'); pdf.setFontSize(9);
  pdf.text('PATIENT', left+14, y+18);
  pdf.setFont('helvetica','normal'); pdf.setFontSize(10.5);
  pdf.text(`${entry.patientName}${entry.patientAge?', '+entry.patientAge+' yrs':''}${entry.patientGender?', '+entry.patientGender:''}`, left+14, y+33);
  pdf.setFontSize(9); pdf.setTextColor(90,110,105);
  pdf.text(entry.patientPhone||'-', left+14, y+46);

  pdf.setFont('helvetica','bold'); pdf.setFontSize(9); pdf.setTextColor(20,36,32);
  pdf.text('DATE', right-110, y+18);
  pdf.setFont('helvetica','normal'); pdf.setFontSize(10.5);
  pdf.text(niceDate(entry.date), right-110, y+33);
  y += 54 + 20;

  function sectionLabel(text){
    pdf.setFont('helvetica','bold'); pdf.setFontSize(9.5); pdf.setTextColor(14,79,73);
    pdf.text(text.toUpperCase(), left, y);
    pdf.setDrawColor(225,233,230); pdf.setLineWidth(0.7);
    const tw = pdf.getTextWidth(text.toUpperCase());
    pdf.line(left+tw+8, y-3, right, y-3);
    y += 16;
    pdf.setTextColor(38,51,47); pdf.setFont('helvetica','normal'); pdf.setFontSize(10.5);
  }

  if(entry.vitals){
    sectionLabel('Vitals');
    const w = pdf.splitTextToSize(entry.vitals, right-left);
    pdf.text(w, left, y); y += 14*w.length + 10;
  }

  sectionLabel('Diagnosis');
  const diagLines = pdf.splitTextToSize(entry.diagnosis||'-', right-left);
  pdf.text(diagLines, left, y); y += 14*diagLines.length + 10;

  const rxLines = (entry.prescription||'').split('\n').filter(Boolean);
  if(rxLines.length){
    sectionLabel('Rx  ·  Prescription');
    rxLines.forEach((line,i)=>{
      const wrapped = pdf.splitTextToSize(line, right-left-22);
      pdf.setFont('helvetica','bold'); pdf.setTextColor(14,79,73);
      pdf.text((i+1)+'.', left, y);
      pdf.setFont('helvetica','normal'); pdf.setTextColor(38,51,47);
      pdf.text(wrapped, left+18, y);
      y += 14*wrapped.length + 4;
    });
    y += 6;
  }

  if(entry.advice){
    sectionLabel('Advice');
    const w = pdf.splitTextToSize(entry.advice, right-left);
    pdf.text(w, left, y); y += 14*w.length + 10;
  }
  if(entry.notes){
    sectionLabel('Notes');
    const w = pdf.splitTextToSize(entry.notes, right-left);
    pdf.text(w, left, y); y += 14*w.length + 10;
  }

  y = Math.max(y+30, 500);
  pdf.setFontSize(8); pdf.setTextColor(150,160,158);
  pdf.text('Generated via AppointoDoc', left, y+30);
  pdf.setDrawColor(140,140,140); pdf.setLineWidth(0.8);
  pdf.line(right-190, y, right, y);
  pdf.setFont('helvetica','bold'); pdf.setFontSize(10.5); pdf.setTextColor(20,36,32);
  pdf.text(doc.name, right, y+14, {align:'right'});
  pdf.setFont('helvetica','normal'); pdf.setFontSize(9); pdf.setTextColor(90,110,105);
  pdf.text(doc.spec, right, y+27, {align:'right'});
  return pdf;
}
function openSlipModal(doc, entry){
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-backdrop"><div class="modal wide">
      <button class="modal-close" id="close-m">${ICONS.x}</button>
      <h3>Prescription Slip</h3>
      <div class="sub">Download ya share karein</div>
      ${slipHtml(doc, entry)}
      <div class="modal-actions">
        <button class="btn btn-coral" style="flex:1;" id="slip-download">${ICONS.download} Download PDF</button>
        <button class="btn btn-outline" style="flex:1;" id="slip-share">${ICONS.share} Share</button>
      </div>
    </div></div>
  `;
  document.getElementById('close-m').addEventListener('click', ()=>{ root.innerHTML=''; });
  document.getElementById('slip-download').addEventListener('click', ()=>{
    const pdf = buildSlipPdf(doc, entry);
    if(!pdf){ toast('PDF library load nahi ho payi — internet check karein'); return; }
    pdf.save(`slip-${entry.patientName.replace(/\s+/g,'-')}-${entry.date}.pdf`);
    toast('Slip downloaded');
  });
  document.getElementById('slip-share').addEventListener('click', async ()=>{
    const summary = `Prescription Slip — ${doc.clinicName||doc.name}\nPatient: ${entry.patientName}\nDate: ${niceDate(entry.date)}\nDiagnosis: ${entry.diagnosis}\n${entry.prescription?'Rx: '+entry.prescription.replace(/\n/g,'; '):''}`;
    try{
      const pdf = buildSlipPdf(doc, entry);
      if(pdf && navigator.canShare){
        const blob = pdf.output('blob');
        const file = new File([blob], 'prescription-slip.pdf', {type:'application/pdf'});
        if(navigator.canShare({files:[file]})){
          await navigator.share({ files:[file], title:'Prescription Slip', text: summary });
          return;
        }
      }
      if(navigator.share){ await navigator.share({ title:'Prescription Slip', text: summary }); return; }
      copyText(summary, (ok)=>{ toast(ok ? 'Slip details copied' : 'Sharing supported nahi hai is browser me'); });
    }catch(e){ /* user cancelled share sheet */ }
  });
}

/* ================= ROOT RENDER ================= */
function renderRoot(){
  document.getElementById('modal-root').innerHTML = '';
  if(ui.route.type==='public') renderPublic();
  else if(ui.route.type==='admin') renderAdmin();
  else if(ui.route.type==='superadmin') renderSuperadmin();
  else renderDirectory();
}

/* ================= INIT ================= */
async function init(){
  await loadState();
  if(!state.doctors) state.doctors=[];
  if(!state.appointments) state.appointments=[];
  if(!state.histories) state.histories=[];
  if(!state.payments) state.payments=[];
  if(!state.ledger) state.ledger=[];
  if(!state.documents) state.documents=[];
  if(!state.reviews) state.reviews=[];
  if(!state.familyMembers) state.familyMembers=[];
  state.doctors.forEach(d=>{
    if(!d.payMethods) d.payMethods = defaultPayMethods();
    if(!d.clinicName) d.clinicName = d.name;
    if(!d.password) d.password = '1234';
    if(!d.workingHours) d.workingHours = defaultWorkingHours();
    if(d.active===undefined) d.active = true;
    if(!d.loginId) d.loginId = genLoginId(d.name, d.mobile);
    if(!d.fees || !d.fees.length) d.fees = [{id:uid(), label:'Consultation', amount:d.fee||300}];
    if(!d.subscription) d.subscription = {status:'unpaid', amount:999, paidUntil:null};
  });
  expireOldAppointments();
  parseRoute();
  renderRoot();
}
init();
</script>
